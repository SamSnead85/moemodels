name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 24.12.0]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate the public export boundary
        run: npm run check:public-boundary

      - name: Build and test packages
        run: npm run test:unit

      - name: Pack and install all public packages in an empty project
        run: npm run test:package-smoke

      - name: Reject high-severity production dependency advisories
        run: npm audit --omit=dev --audit-level=high

  passport-action:
    name: Passport Action fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js to create a synthetic protocol fixture
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Build a clearly synthetic, non-performance fixture
        run: |
          npm ci --no-audit --no-fund
          npm run build:bench --silent
          node scripts/create-passport-fixture.mjs "$RUNNER_TEMP/passport-v0.2.fixture.json"

      - name: Verify the synthetic fixture through the public Action
        uses: ./
        with:
          passport: ${{ runner.temp }}/passport-v0.2.fixture.json
